<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Content</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background-color: transparent;
            padding: 20px 4%;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
        }
        .netflix-logo {
            color: #E50914;
            font-size: 2.5rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            line-height: 1;
        }
        .main-background {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(to top, rgba(0,0,0,0.8) 0, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%), url('https://assets.nflxext.com/ffe/siteui/vlv3/f841d4c7-10e1-40af-bcae-07a3f8dc141a/f6d7434e-d6de-4185-a6d4-c77a2d08737b/US-en-20220502-popsignuptwoweeks-perspective_alpha_website_medium.jpg');
            background-size: cover;
            background-position: center;
            padding: 80px 20px;
        }
        .content-container {
            background-color: rgba(0, 0, 0, 0.85);
            padding: 60px;
            border-radius: 4px;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .content-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            border-bottom: 2px solid #E50914;
            padding-bottom: 10px;
            display: inline-block;
        }
        .text-area {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #d1d1d1;
            min-height: 300px;
            overflow-x: auto;
        }
        .text-area canvas {
            display: block;
            width: min(100%, 760px) !important;
            max-width: 100% !important;
            height: 420px !important;
            max-height: 420px !important;
            margin: 16px auto;
        }
        .btn-back {
            border-color: #ffffff47;
            color: #ffffff47;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="netflix-logo" href="#">NETFLIX</a>
    </nav>
    <div class="main-background">
        <div class="content-container">
            <h1 class="content-title">Netflix Analysis</h1>
            <div class="text-area">
                {{analysis | safe}}
            </div>
            <div class="d-flex justify-content-between align-items-center border-top border-secondary pt-4">
                <a href="/netflix" class="btn btn-back" role="button" id="back">Back</a>
                <a href="/" class="btn btn-back" role="button">Main Page</a>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
