<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image URL Submitter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 flex items-center justify-center min-h-screen transition-colors duration-300">
    <form action = "/instagramSubmit" method = "POST">
        <div class="w-full max-w-xl mx-auto p-6 md:p-8 bg-white dark:bg-gray-800 rounded-xl shadow-2xl space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Image Viewer</h1>
                <p class="text-gray-500 dark:text-gray-400 mt-2">Enter an image URL to display it below.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-4">
                <input name="imageURLinput" type="url" id="imageUrlInput" placeholder="https://example.com/image.png" class="flex-grow w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-500/30 dark:focus:ring-blue-400/30 transition duration-300">
                <button id="loadImageBtn" class="w-full sm:w-auto px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500/50 dark:focus:ring-blue-400/50 transition-transform transform hover:scale-105 active:scale-95">
                    Load Image
                </button>
            </div>
            <div id="imageContainer" class="mt-6 w-full aspect-video bg-gray-200 dark:bg-gray-700 rounded-lg flex items-center justify-center overflow-hidden border-2 border-dashed border-gray-300 dark:border-gray-600">
                <span id="placeholderText" class="text-gray-400 dark:text-gray-500">Image will appear here</span>
                <img id="imageDisplay" src="" alt="Loaded image" class="hidden w-full h-full object-contain">
            </div>
        </div>
        <div class="w-full max-w-xl mx-auto p-6 md:p-8 bg-white rounded-xl shadow-xl space-y-6 mb-8">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-gray-900">Post Details</h1>
                <p class="text-gray-500 mt-2">Provide some more preferences about your caption.</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label for="category-select" class="block text-sm font-medium text-gray-700 mb-1">What's the language of the caption?</label>
                    <select id="category-select" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-500/30 transition duration-300" name="language">
                        <option>English</option>
                        <option>Cantonese</option>
                        <option>French</option>
                        <option>Japanese</option>
                        <option>Korean</option>
                    </select>
                </div>
                <div>
                    <label for="location-select" class="block text-sm font-medium text-gray-700 mb-1">What's the length of the caption?</label>
                    <select id="location-select" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-500/30 transition duration-300" name="length">
                        <option>Long</option>
                        <option>Medium</option>
                        <option>Short</option>
                    </select>
                </div>
                <div>
                    <label for="lighting-select" class="block text-sm font-medium text-gray-700 mb-1">How much hashtags in the caption?</label>
                    <select id="lighting-select" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-500/30 transition duration-300" name="hashtags">
                        <option>More</option>
                        <option>Medium</option>
                        <option>Less</option>
                    </select>
                </div>
            </div>
        </div>
        <button class="fixed bottom-8 right-8 px-6 py-3 bg-gray-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-500/50 dark:focus:ring-gray-400/50 transition" type = "submit" id = "Submit">
            Submit
        </button>
        <script>
            $(document).ready(function(){
                function updateImage() {
                    const imageUrl = $('#imageUrlInput').val().trim();
                    if (imageUrl) {
                        $('#imageDisplay').attr('src', imageUrl).removeClass('hidden');
                        $('#placeholderText').addClass('hidden');
                    }
                }
                $('#loadImageBtn').on('click', function(event){
                    event.preventDefault();
                    updateImage();
                });
                $('#imageUrlInput').on('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        updateImage();
                    }
                });
                $('#imageDisplay').on('error', function() {
                    $(this).addClass('hidden');
                    $('#placeholderText').removeClass('hidden').text('Could not load image. Please check the URL.');
                });
            });
        </script>
    </form>
</body>
</html>
