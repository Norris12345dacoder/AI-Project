<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grammar Analysis</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
        <style>
            :root {
                --brand-green: #15c39a;
                --brand-green-dark: #12a884;
                --brand-bg: #F9FAFC;
            }
            body {
                font-family: 'Inter', sans-serif;
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                height: 100vh;
                overflow: hidden;
                color: #333;
                position: relative;
            }
            body::before {
                content: '';
                position: absolute;
                top: -100px;
                right: -100px;
                width: 400px;
                height: 400px;
                background: rgba(21, 195, 154, 0.15);
                border-radius: 50%;
                filter: blur(80px);
                z-index: -1;
            }
            body::after {
                content: '';
                position: absolute;
                bottom: -100px;
                left: -100px;
                width: 500px;
                height: 500px;
                background: rgba(60, 130, 246, 0.1);
                border-radius: 50%;
                filter: blur(100px);
                z-index: -1;
            }
            .layout-wrapper {
                display: flex;
                height: 100vh;
                width: 100vw;
                justify-content: center;
                backdrop-filter: blur(10px);
            }
            .main-editor {
                flex: 1;
                position: relative;
                overflow-y: auto;
                display: flex;
                justify-content: center;
                padding-top: 40px; 
            }
            .paper {
                width: 100%;
                max-width: 800px;
                background: #fff;
                min-height: calc(100vh - 80px);
                padding: 60px 80px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
                position: relative;
                border-radius: 16px;
                margin-bottom: 40px;
                border-top: 4px solid var(--brand-green);
            }
            .doc-title {
                border: none;
                width: 100%;
                font-size: 24px;
                font-weight: 600;
                margin-bottom: 20px;
                color: #2b2b2b;
                padding-right: 120px;
                display: block;
            }
            .doc-body {
                border: none;
                width: 100%;
                min-height: 60vh;
                resize: none;
                outline: none;
                font-size: 16px;
                line-height: 1.8;
                color: #4a4a4a;
            }
            .send-btn {
                position: absolute;
                top: 120px;
                right: 80px;
                background: linear-gradient(135deg, var(--brand-green) 0%, var(--brand-green-dark) 100%);
                color: white;
                border: none;
                padding: 12px 30px;
                border-radius: 30px;
                font-weight: 600;
                font-size: 14px;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(21, 195, 154, 0.4);
            }
            .send-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(21, 195, 154, 0.6);
            }
            .floating-toolbar {
                position: fixed;
                bottom: 20px;
                right: 30px;
                background: white;
                padding: 8px 16px;
                border-radius: 20px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                font-size: 13px;
                color: #6D758D;
                font-weight: 500;
                z-index: 100;
            }
            ::-webkit-scrollbar {
                width: 8px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: #ddd;
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <div class="layout-wrapper">
            <form id="uploadForm" method = "POST" action = "/grammarlySubmit">
                <div class="main-editor">
                    <div class="paper">
                        <h1 style="color: var(--brand-green); font-size: 2.5rem; font-weight: 700; margin-bottom: 8px;">Grammarly</h1>
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-warning mb-3" role="alert">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        <button class="send-btn" id="send-btn">Send</button>
                        <div class="doc-title">Enter your text here</div>
                        <textarea id="editor" class="doc-body" placeholder="Type or paste your text here to begin..." name="text"></textarea>
                    </div>
                </div>
            </form>
            <div class="floating-toolbar">
                <span id="word-count">0 words</span>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script>
            $(document).ready(function() {
                const $editor = $('#editor');
                const $wordCountDisplay = $('#word-count');
                $editor.on('input', function() {
                    const text = $(this).val();
                    const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
                    $wordCountDisplay.text(wordCount + (wordCount === 1 ? ' word' : ' words'));
                });
                $('.paper').on('click', function(e) {
                    if (!$(e.target).is('button, input, textarea')) {
                        $editor.focus();
                    }
                });
                $('#send-btn').click(function() {
                    const originalText = $(this).text();
                    $(this).text('Sent!');
                    $(this).css('background-color', '#12a884');
                    const data = {
                        title: $('.doc-title').text(),
                        body: $editor.val()
                    };
                    console.log('Sending data:', data);
                    setTimeout(() => {
                        $(this).text(originalText);
                        $(this).css('background-color', '');
                    }, 2000);
                });
            });
        </script>
    </body>
</html>
