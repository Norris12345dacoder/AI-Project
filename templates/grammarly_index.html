<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grammarly Grammar Analysis</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='grammarly_favicon_io/favicon.ico') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='grammarly_favicon_io/favicon-32x32.png') }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='grammarly_favicon_io/favicon-16x16.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='grammarly_favicon_io/apple-touch-icon.png') }}">
        <style>
            :root {
                --brand-green: #15c39a;
                --brand-green-dark: #12a884;
                --brand-bg: #F9FAFC;
            }
            body {
                font-family: 'Inter', sans-serif;
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                height: 100vh;
                overflow: hidden;
                color: #333;
                position: relative;
            }
            body::before {
                content: '';
                position: absolute;
                top: -100px;
                right: -100px;
                width: 400px;
                height: 400px;
                background: rgba(21, 195, 154, 0.15);
                border-radius: 50%;
                filter: blur(80px);
                z-index: -1;
            }
            body::after {
                content: '';
                position: absolute;
                bottom: -100px;
                left: -100px;
                width: 500px;
                height: 500px;
                background: rgba(60, 130, 246, 0.1);
                border-radius: 50%;
                filter: blur(100px);
                z-index: -1;
            }
            .layout-wrapper {
                display: flex;
                height: 100vh;
                width: 100vw;
                justify-content: center;
                backdrop-filter: blur(10px);
            }
            .main-editor {
                flex: 1;
                position: relative;
                overflow-y: auto;
                display: flex;
                justify-content: center;
                padding-top: 40px; 
            }
            .paper {
                width: 100%;
                max-width: 800px;
                background: #fff;
                min-height: calc(100vh - 80px);
                padding: 60px 80px 96px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
                position: relative;
                border-radius: 16px;
                margin-bottom: 40px;
                border-top: 4px solid var(--brand-green);
            }
            .doc-title {
                border: none;
                width: 100%;
                font-size: 24px;
                font-weight: 600;
                margin-bottom: 20px;
                color: #2b2b2b;
                padding-right: 120px;
                display: block;
            }
            .doc-body {
                border: none;
                width: 100%;
                min-height: 60vh;
                resize: none;
                outline: none;
                font-size: 16px;
                line-height: 1.8;
                color: #4a4a4a;
            }
            .send-btn {
                background: linear-gradient(135deg, var(--brand-green) 0%, var(--brand-green-dark) 100%);
                color: white;
                border: none;
                padding: 12px 30px;
                border-radius: 30px;
                font-weight: 600;
                font-size: 14px;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(21, 195, 154, 0.4);
            }
            .action-row {
                position: absolute;
                top: 120px;
                right: 80px;
                display: flex;
                align-items: center;
            }
            .loading-indicator {
                display: none;
                align-items: center;
                gap: 8px;
                font-size: 13px;
                font-weight: 600;
                color: #4a4a4a;
                text-transform: lowercase;
                white-space: nowrap;
                position: absolute;
                left: 50%;
                bottom: 28px;
                transform: translateX(-50%);
                background: rgba(255, 255, 255, 0.95);
                border: 1px solid #d8e2df;
                border-radius: 999px;
                padding: 8px 14px;
                z-index: 20;
            }
            .spinner {
                width: 16px;
                height: 16px;
                border-radius: 50%;
                border: 2px solid #d8e2df;
                border-top-color: var(--brand-green);
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .send-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(21, 195, 154, 0.6);
            }
            .floating-toolbar {
                position: fixed;
                bottom: 20px;
                right: 30px;
                background: white;
                padding: 8px 16px;
                border-radius: 20px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                font-size: 13px;
                color: #6D758D;
                font-weight: 500;
                z-index: 100;
            }
            ::-webkit-scrollbar {
                width: 8px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: #ddd;
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <div class="layout-wrapper">
            <form id="uploadForm" method = "POST" action = "/grammarlySubmit">
                <div class="main-editor">
                    <div class="paper">
                        <h1 style="color: var(--brand-green); font-size: 2.5rem; font-weight: 700; margin-bottom: 8px;">Grammarly</h1>
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-warning mb-3" role="alert">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        <div class="action-row">
                            <button class="send-btn" id="send-btn" type="submit">Send</button>
                        </div>
                        <div class="doc-title">Enter your text here</div>
                        <textarea id="editor" class="doc-body" placeholder="Type or paste your text here to begin..." name="text"></textarea>
                        <span class="loading-indicator" id="grammarlyLoading" aria-live="polite">
                            <span class="spinner" aria-hidden="true"></span>
                            awaiting AI response
                        </span>
                    </div>
                </div>
            </form>
            <div class="floating-toolbar">
                <span id="word-count">0 words</span>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script>
            $(document).ready(function() {
                const min_words = 10;
                const $editor = $('#editor');
                const $wordCountDisplay = $('#word-count');
                const $form = $('#uploadForm');
                const $sendBtn = $('#send-btn');
                const $loading = $('#grammarlyLoading');
                let isSubmitting = false;
                function getWordCount() {
                    const text = $editor.val();
                    return text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
                }
                function updateSubmitState() {
                    const wordCount = getWordCount();
                    const canSubmit = wordCount >= min_words && !isSubmitting;
                    $sendBtn.prop('disabled', !canSubmit).css('opacity', canSubmit ? '' : '0.6');
                }
                function resetUiState() {
                    isSubmitting = false;
                    $form.trigger('reset');
                    $loading.hide();
                    $wordCountDisplay.text('0 words');
                    updateSubmitState();
                }
                $editor.on('input', function() {
                    const wordCount = getWordCount();
                    $wordCountDisplay.text(wordCount + (wordCount === 1 ? ' word' : ' words'));
                    updateSubmitState();
                });
                $('.paper').on('click', function(e) {
                    if (!$(e.target).is('button, input, textarea')) {
                        $editor.focus();
                    }
                });
                $form.on('submit', function(e) {
                    if (isSubmitting) {
                        e.preventDefault();
                        return;
                    }
                    if (getWordCount() < min_words) {
                        e.preventDefault();
                        updateSubmitState();
                        $editor.focus();
                        return;
                    }
                    if (!$form[0].checkValidity()) {
                        return;
                    }
                    e.preventDefault();
                    isSubmitting = true;
                    $sendBtn.prop('disabled', true).css('opacity', '0.8');
                    $loading.css('display', 'inline-flex');
                    requestAnimationFrame(function() {
                        setTimeout(function() {
                            $form[0].submit();
                        }, 50);
                    });
                });
                $(window).on('pageshow', resetUiState);
                resetUiState();
            });
        </script>
    </body>
</html>
