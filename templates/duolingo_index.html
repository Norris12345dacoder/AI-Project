<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn a Language</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap');
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: 'Nunito', sans-serif;
    background-color: #ffffff;
    color: #4b4b4b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  .top-half {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 40px;
    width: 100%;
  }
  .owl-svg {
    width: 160px;
    height: 160px;
    animation: bob 2s infinite ease-in-out;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .bottom-half {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  h1 {
    font-size: 24px;
    text-align: center;
    margin: 0 0 12px 0;
    color: #3c3c3c;
  }
  .select-container {
    width: 100%;
    position: relative;
  }
  select {
    width: 100%;
    padding: 16px 20px;
    font-size: 18px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    color: #4b4b4b;
    background-color: #ffffff;
    border: 2px solid #e5e5e5;
    border-radius: 16px;
    appearance: none;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s;
  }
  select:hover {
    background-color: #f7f7f7;
  }
  select:focus {
    border-color: #1cb0f6; 
  }
  .select-icon {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    fill: #afafaf;
  }
  .btn {
    width: 100%;
    margin-top: 10px;
    padding: 16px;
    font-size: 18px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    color: white;
    background-color: #58cc02;
    border: none;
    border-radius: 16px;
    box-shadow: 0 4px 0 #58a700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: filter 0.2s, transform 0.1s, box-shadow 0.1s;
  }
  .btn:hover {
    filter: brightness(1.08);
  }
  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #58a700;
  }
</style>
</head>
<body>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="width: 100%; margin-bottom: 12px; padding: 12px 14px; border-radius: 12px; background: #fff4e5; color: #8a4b00; border: 1px solid #ffd59a; font-size: 14px;">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <div class="top-half">
       <svg class="owl-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
         <path d="M 20 45 C 20 15 80 15 80 45 C 80 75 70 90 50 90 C 30 90 20 75 20 45 Z" fill="#58cc02"/>
         <path d="M 30 55 C 30 40 70 40 70 55 C 70 70 60 85 50 85 C 40 85 30 70 30 55 Z" fill="#78c800"/>
         <circle cx="36" cy="40" r="12" fill="#ffffff"/>
         <circle cx="64" cy="40" r="12" fill="#ffffff"/>
         <circle cx="39" cy="40" r="5" fill="#4b4b4b"/>
         <circle cx="61" cy="40" r="5" fill="#4b4b4b"/>
         <path d="M 46 48 L 54 48 L 50 56 Z" fill="#ffc800" rx="2"/>
         <path d="M 34 88 C 34 94 44 94 44 88 Z" fill="#ffc800"/>
         <path d="M 56 88 C 56 94 66 94 66 88 Z" fill="#ffc800"/>
       </svg>
    </div>
    <form action="/duolingoSubmit" method="POST">
    <div class="bottom-half">
      <h1>I want to learn...</h1>
      <form action="/duolingoSubmit" method="POST">
      <div class="select-container">
          <select id="language" aria-label="Select a language" name="language">
            <option value="" disabled selected>Choose a language</option>
            <option value="Spanish">Spanish</option>
            <option value="French">French</option>
            <option value="German">German</option>
            <option value="Italian">Italian</option>
            <option value="Japanese">Japanese</option>
            <option value="Korean">Korean</option>
            <option value="Cantonese">Cantonese</option>
          </select>
        <svg class="select-icon" width="24" height="24" viewBox="0 0 24 24">
          <path d="M7 10l5 5 5-5z" />
        </svg>
      </div>
      <button class="btn">Continue</button>
      </form>
    </div>
  </div>
</body>
</html>
